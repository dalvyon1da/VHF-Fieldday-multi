<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fieldday Live</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Fieldday Live – ON4VRA stations /P</h1>

<!-- Compteur QSO -->
<div id="qsoCounter" class="qso-box">QSO : 0</div>

<!-- Ligne horizontale : rouge + vert -->
<div class="top-row">

  <!-- Bloc rouge -->
  <div class="table-title">
    INDICATIF – 160m – 80m – 40m
  </div>

  <!-- Bloc vert -->
  <div id="remainingBox" class="remaining-box">
    <h2>Stations non faites</h2>
    <ul id="remainingList"></ul>
  </div>

</div>

<!-- Tableau principal -->
<table id="fdTable">
  <thead>
    <tr>
      <th>Indicatif</th>
      <th>160m</th>
      <th>80m</th>
      <th>40m</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
