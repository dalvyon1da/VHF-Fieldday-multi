<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fieldday Live</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Fieldday Multiplicateur Live – ON4CPN/P  </h1>

<!-- Ligne compteur + heures + reset -->
<div class="top-info">
    <div id="qsoCounter" class="qso-box">QSO : 0</div>

    <div id="timeBox" class="time-box">
        <span id="localTime">Local : --:--:--</span>
        <span id="utcTime">UTC : --:--:--</span>
    </div>

    <button id="resetBtn" class="reset-btn">RESET</button>
</div>

<!-- Colonne gauche : bande bleue + tableau -->
<div class="left-column">

  <!-- Bande bleue -->
  <div class="table-title">
    Stations 10 points 
  </div>

  <!-- Tableau -->
  <table id="fdTable">
    <thead>
      <tr>
        <th>Indicatif</th>
        <th>160m</th>
        <th>80m</th>
        <th>40m</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script src="script.js"></script>
</body>
</html>
