<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fieldday Live</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Fieldday Live – ON4VRA stations /P</h1>

<!-- Compteur QSO ORANGE -->
<div id="qsoCounter" class="qso-box">QSO : 0</div>

<!-- Ligne horizontale : tableau à gauche + stations restantes à droite -->
<div class="main-row">

  <!-- Colonne gauche : bande rouge + tableau -->
  <div class="left-column">

    <!-- Bande rouge -->
    <div class="table-title">
      INDICATIF – 160m – 80m – 40m
    </div>

    <!-- Tableau -->
    <table id="fdTable">
      <thead>
        <tr>
          <th>Indicatif</th>
          <th>160m</th>
          <th>80m</th>
          <th>40m</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

  <!-- Colonne droite : stations non faites -->
  <div id="remainingBox" class="remaining-box">
    <h2>Stations non faites</h2>
    <ul id="remainingList"></ul>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
