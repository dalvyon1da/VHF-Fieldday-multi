<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fieldday Live</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Fieldday Live – ON4CPN/P – 10 points QSO</h1>

<div class="top-info">
    <div id="qsoCounter" class="qso-box">QSO : 0</div>

    <div id="timeBox" class="time-box">
        <span id="localTime">Local : --:--:--</span>
        <span id="utcTime">UTC : --:--:--</span>
    </div>

    <button id="resetBtn" class="reset-btn">CONTEST RESET</button>
</div>

<div class="table-wrapper">
  <table id="fdTable">
    <thead>
      <tr id="bandHeader">
        <th>Indicatif</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
